<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Bharat AI Innovation 2026</title>
    <!-- Served by Cloudflare Pages with status 404 for any path that matches no
         file. Until 30 Oct 2026 there was no 404.html, so Pages ran in single-page
         mode and answered every unknown path under /js, /css, /images and the other
         static folders with the home page and a 200 - which also meant a script tag
         pointing at a missing file loaded HTML and failed silently. -->
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon-64.png">
    <style>
        :root { --orange: #FF6B00; --ink: #1E2140; --muted: #5E6585; --bg: #F8F9FF; --line: #E4E7F4; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font-family: Manrope, "Segoe UI", system-ui, -apple-system, sans-serif; padding: 24px 16px; }
        main { max-width: 520px; width: 100%; text-align: center; }
        img { height: 56px; width: auto; }
        .code { margin: 28px 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: var(--orange); }
        h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
        nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none; }
        nav a.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
        nav a:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
        .small { margin-top: 28px; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <a href="/"><img src="/images/logo-nav.webp" alt="Bharat AI Innovation"></a>
        <div class="code">404</div>
        <h1>That page isn&rsquo;t here</h1>
        <p>The address may be mistyped, or the page has moved. These are the places most people are looking for.</p>
        <nav>
            <a href="/" class="primary">Home</a>
            <a href="/passes">Passes</a>
            <a href="/register">Register</a>
            <a href="/app">Open the app</a>
            <a href="/conference">Conference</a>
            <a href="/exhibition">Exhibition</a>
            <a href="/contact">Contact</a>
        </nav>
        <p class="small">20&ndash;21 November 2026 &middot; World Trade Center Mumbai</p>
    </main>
</body>
</html>
